name: Tests

on:
  push:
    branches: ["**"]
  # Also runs for pull requests from forks, which don't trigger a push in this repo.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Fails if any test fails or coverage drops below 100% (see pyproject.toml).
      - name: Run tests
        run: pytest
