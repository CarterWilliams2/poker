name: UI

# Root *.py files are the engine. Running on engine changes too warns the engine team when a
# change breaks something the UI relies on (rule 6 in CLAUDE.md).
on:
  push:
    branches: ["**"]
    paths: ["ui/**", ".github/workflows/ui.yml", "*.py"]
  # Also runs for pull requests from forks, which don't trigger a push in this repo.
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml", "*.py"]

permissions:
  contents: read

jobs:
  # Not called test: main requires the engine's check of that name, and a UI job sharing it could
  # make UI failures block engine PRs instead of only warning.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ui/requirements*.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Fails if any test fails or coverage of ui/server drops below 100% (see ui/pyproject.toml).
      - name: Run server tests
        run: pytest
