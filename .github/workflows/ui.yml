name: UI

# Root *.py files are the engine. Running on engine changes too warns the engine team when a
# change breaks something the UI relies on (rule 6 in CLAUDE.md).
on:
  push:
    branches: ["**"]
    paths: ["ui/**", ".github/workflows/ui.yml", "*.py"]
  # Also runs for pull requests from forks, which don't trigger a push in this repo.
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml", "*.py"]

permissions:
  contents: read

jobs:
  # No job here is called test: main requires the engine's check of that name, and a UI job
  # sharing it could make UI failures block engine PRs instead of only warning.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ui/requirements*.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Fails if any test fails or coverage of ui/server drops below 100% (see ui/pyproject.toml).
      - name: Run server tests
        run: pytest

  # The engine contract tests again, on their own, so that on an engine PR a failure shows up
  # under this job's name and plainly means the engine changed something the UI relies on.
  engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ui/requirements*.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Coverage is the server job's check. These tests only exercise the engine.
      - name: Check the engine API the UI relies on
        run: pytest tests/test_engine_contract.py --no-cov

  # Fails a pull request that changes both UI and engine files (rule 1 in CLAUDE.md). Pushes skip
  # it, because only a pull request has a base branch to compare with.
  team-boundary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ui
    steps:
      # A pull request's checkout is the PR merged into its base, so its first parent, HEAD^1, is
      # the base. Fetching two levels of history brings that parent along.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check that only one team's files change
        run: python -m checks.team_boundary HEAD^1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run web tests
        run: npm test

      - name: Build
        run: npm run build
